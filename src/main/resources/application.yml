spring:
  application:
    name: epay
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # rasm 5 MB gacha (ImageStorage ham tekshiradi); so'rov — fayl va bir oz qo'shimcha joy
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

epay:
  # yuklangan rasmlar papkasi (/uploads/** shu yerdan beriladi)
  upload-dir: ${EPAY_UPLOAD_DIR:uploads}
  # IP bo'yicha cheklovlar: window ichida ko'pi bilan max urinish (config/RateLimiter)
  rate-limit:
    order:
      max: 5
      window: 10m
    track:
      max: 10
      window: 1m
    login:
      max: 10
      window: 15m
