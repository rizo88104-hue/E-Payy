spring:
  application:
    name: epay
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # rasm 5 MB gacha (ImageStorage ham tekshiradi); so'rov — fayl va bir oz qo'shimcha joy
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      # xodim sessiyasi (server tomonda); ID faqat cookie'da, URL'da emas
      timeout: 8h
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        # prod'da true (application-prod.yml)
        secure: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

epay:
  # yuklangan rasmlar papkasi (/uploads/** shu yerdan beriladi)
  upload-dir: ${EPAY_UPLOAD_DIR:uploads}
  # IP bo'yicha cheklovlar: window ichida ko'pi bilan max urinish (config/RateLimiter)
  rate-limit:
    order:
      max: 5
      window: 10m
    track:
      max: 10
      window: 1m
    # login: IP bo'yicha xato urinishlar; login-user: bitta login nomiga barcha IP lardan (yumshoqroq)
    login:
      max: 10
      window: 15m
    login-user:
      max: 30
      window: 15m
  # saytning ochiq manzili, masalan https://epay.uz (prod'da majburiy, StartupValidator)
  public-url: ${PUBLIC_URL:}
  cors:
    # yagona ruxsat etilgan domen; bo'sh — CORS yo'q (faqat o'z domen). Hech qachon "*"
    allowed-origin: ${CORS_ALLOWED_ORIGIN:}
  security:
    # omborchi katalogda narxni o'zgartira oladimi (TZ 7: standart — yo'q)
    warehouse-can-edit-price: ${WAREHOUSE_CAN_EDIT_PRICE:false}
  admin:
    # birinchi admin (xodimlar jadvali bo'sh bo'lsa); prod'da parol 12+ belgi
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  payment:
    # 1 $ necha so'm; buyurtmada qotiriladi (prod'da majburiy, StartupValidator)
    usd-rate: ${PAYMENT_USD_RATE:}
  order:
    # to'lanmagan buyurtma shu vaqtdan keyin eskiradi (expires_at, OrderExpiryJob)
    unpaid-timeout: ${ORDER_UNPAID_TIMEOUT:24h}
    # bitta telefondan to'lanmagan NEW buyurtmalar chegarasi
    max-pending-per-phone: 3
    # kafolat muddati (yil) -> narxga qo'shiladigan foiz; eng qisqasi narx ichida
    warranty:
      1: 0
      3: 10
      5: 20
  payme:
    merchant-id: ${PAYME_MERCHANT_ID:}
    key: ${PAYME_KEY:}
    checkout-url: ${PAYME_CHECKOUT_URL:https://checkout.paycom.uz}
  click:
    service-id: ${CLICK_SERVICE_ID:}
    secret-key: ${CLICK_SECRET_KEY:}
    api-url: ${CLICK_API_URL:https://api.click.uz/v2/merchant}
